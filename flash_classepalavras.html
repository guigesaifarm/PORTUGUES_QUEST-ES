<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Interativos: Funções das Classes de Palavras</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #2563eb; 
            --text-color: #333333;
            --text-muted: #7f8c8d;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 2.3rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .tracker {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        /* Flashcard Container */
        .scene {
            width: 100%;
            max-width: 650px;
            height: 380px;
            perspective: 1000px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--border-radius);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border: 1px solid #e1e8ed;
        }

        .card-face-front {
            background: #ffffff;
        }

        .card-face-back {
            background: #f8fafc;
            transform: rotateY(180deg);
            border-left: 6px solid var(--accent-color);
        }

        .card-category {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* Fontes ajustadas para melhor legibilidade */
        .card-content {
            font-size: 1.7rem; 
            line-height: 1.5;
            color: var(--primary-color);
            font-weight: 500;
            text-align: center;
            margin: auto 0;
        }

        .card-face-back .card-content {
            font-size: 1.15rem; 
            text-align: left;
            color: #34495e;
        }

        .card-hint {
            font-size: 1.1rem;
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background-color: var(--card-bg);
            color: var(--primary-color);
            border: 1px solid #dcdfe6;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        button:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .scene {
                height: 400px;
            }
            .card-content {
                font-size: 1.3rem;
            }
            .card-face-back .card-content {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Flashcards Interativos</h1>
        <p>Funções das Classes de Palavras para Concursos</p>
    </header>

    <div class="tracker" id="card-tracker">Card 1 de 30</div>

    <div class="scene" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-face-front">
                <div class="card-category" id="card-category">Morfossintaxe</div>
                <div class="card-content" id="card-front">Carregando...</div>
                <div class="card-hint">💡 Clique para ver a resposta</div>
            </div>
            <div class="card-face card-face-back">
                <div class="card-category">Resposta Explicada</div>
                <div class="card-content" id="card-back">Carregando...</div>
                <div class="card-hint">💡 Clique para virar novamente</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">Anterior</button>
        <button onclick="flipCard()">Virar Card</button>
        <button onclick="nextCard()">Próximo</button>
    </div>

    <script>
        const cardsData = [
            {
                category: "Substantivo",
                front: "Qual é a principal função morfossintáctica do <b>substantivo</b> na frase?",
                back: "É ser o <b>núcleo</b> de funções sintáticas que exigem nome, atuando primordialmente como sujeito, objeto direto, objeto indireto, complemento nominal, agente da passiva ou aposto."
            },
            {
                category: "Artigo",
                front: "Qual é a função básica do <b>artigo</b> (definido ou indefinido) junto ao substantivo?",
                back: "Especificar ou generalizar o substantivo, além de funcionar morfologicamente como um <b>adjunto adnominal</b> e sinalizar gênero e número."
            },
            {
                category: "Adjetivo",
                front: "Qual é a função sintática exclusiva do <b>adjetivo</b> na estrutura oracional?",
                back: "Funcionar como <b>adjunto adnominal</b> (quando qualifica diretamente dentro do termo) ou como <b>predicativo</b> (do sujeito ou do objeto, separado por verbo de ligação)."
            },
            {
                category: "Pronome Substantivo",
                front: "Quando um pronome assume função de <b>pronome substantivo</b>, qual é o seu papel na oração?",
                back: "Ele substitui inteiramente o nome e assume as funções típicas de um substantivo (como ser o sujeito ou objeto da frase, ex: <i>Alguém</i> bateu à porta)."
            },
            {
                category: "Pronome Adjetivo",
                front: "Quando um pronome assume função de <b>pronome adjetivo</b>, qual é o seu papel?",
                back: "Ele acompanha o substantivo, especificando-o ou determinando-o, exercendo sintaticamente a função de <b>adjunto adnominal</b> (Ex: <i>Meu</i> carro quebrou)."
            },
            {
                category: "Numeral",
                front: "Qual é a função morfossintática exercida pelos <b>numerais</b>?",
                back: "Eles acompanham ou substituem o substantivo, indicando quantidade, ordem, fração ou multiplicação. Sintaticamente, atuam como adjunto adnominal ou como o próprio núcleo do termo (sujeito, objeto, etc.)."
            },
            {
                category: "Verbo de Ligação",
                front: "Qual é a função estrutural dos <b>verbos de ligação</b> na oração?",
                back: "Eles não indicam ação, mas servem como elo entre o sujeito e uma característica sua, exigindo obrigatoriamente um <b>predicativo do sujeito</b> (Ex: O dia <i>está</i> chuvoso)."
            },
            {
                category: "Verbo Transitivo Direto",
                front: "O que caracteriza a função sintática de um <b>verbo transitivo direto (VTD)</b>?",
                back: "É um verbo que exige um complemento sem preposição obrigatória, chamado de <b>objeto direto</b> (Ex: Comprei <i>um livro</i>)."
            },
            {
                category: "Verbo Transitivo Indireto",
                front: "O que caracteriza a função sintática de um <b>verbo transitivo indireto (VTI)</b>?",
                back: "É um verbo que exige um complemento introduzido obrigatoriamente por uma preposição, chamado de <b>objeto indireto</b> (Ex: Gosto <i>de música</i>)."
            },
            {
                category: "Verbo Intransitivo",
                front: "Qual é a peculiaridade sintática de um <b>verbo intransitivo (VI)</b>?",
                back: "Possui sentido completo em si mesmo e <b>não exige complemento obrigatório</b> para fazer sentido, podendo vir acompanhado de adjuntos adverbiais (Ex: A criança <i>dormiu</i>)."
            },
            {
                category: "Advérbio",
                front: "Qual é a principal função sintática do <b>advérbio</b> na oração?",
                back: "Funcionar como <b>adjunto adverbial</b>, modificando o sentido de um verbo, de um adjetivo ou de outro advérbio (Ex: Ela cantou <i>muito</i> bem)."
            },
            {
                category: "Preposição",
                front: "Qual é a função morfossintática das <b>preposições</b>?",
                back: "São palavras invariáveis que ligam termos de uma oração, estabelecendo subordinação (ex: regência verbal ou nominal). Sintaticamente, integram o termo regido (não possuem função isolada)."
            },
            {
                category: "Conjunção Coordenativa",
                front: "Qual é a função sintática das <b>conjunções coordenativas</b>?",
                back: "Ligar orações (ou termos de mesma função sintática) que são independentes sintaticamente entre si, estabelecendo relações de adição, adversidade, alternância, conclusão ou explicação."
            },
            {
                category: "Conjunção Subordinativa",
                front: "Qual é a função das <b>conjunções subordinativas</b> em um período composto?",
                back: "Introduzir uma oração subordinada que exerce uma função sintática (como sujeito, objeto, adjunto adverbial, etc.) em relação à oração principal."
            },
            {
                category: "Interjeição",
                front: "Qual é a função das <b>interjeições</b> na estrutura da língua?",
                back: "São palavras que exprimem emoções, sensações ou estados de espírito repentinos. Sintaticamente, funcionam como <b>frases de valor exclamativo</b> (enunciados de uma palavra só) e não se integram à estrutura sintática tradicional."
            },
            {
                category: "Pronome Relativo",
                front: "Além de retomar um termo anterior, qual é a função sintática do <b>pronome relativo</b> dentro da oração que ele introduz?",
                back: "Ele exerce a função sintática específica que o verbo ou nome da oração subordinada exigir (pode ser sujeito, objeto direto, objeto indireto, etc.)."
            },
            {
                category: "Pronome Oblíquo 'O / A'",
                front: "Qual é a função sintática padrão dos pronomes oblíquos átonos <b>o, a, os, as</b>?",
                back: "Eles exercem exclusivamente a função de <b>objeto direto</b> (Ex: Vi-<i>o</i> na rua)."
            },
            {
                category: "Pronome Oblíquo 'Lhe'",
                front: "Qual é a função sintática padrão do pronome oblíquo átono <b>lhe / lhes</b>?",
                back: "Eles exercem obrigatoriamente a função de <b>objeto indireto</b>, completando verbos transitivos indiretos (Ex: Dei um presente <i>lhe</i> / <i>a ele</i>)."
            },
            {
                category: "Agente da Passiva",
                front: "Qual classe de palavras introduz obrigatoriamente o agente da oração passiva e qual preposição o acompanha?",
                back: "É introduzido por um <b>substantivo</b> (ou pronome substantivo) precedido obrigatoriamente pelas preposições <b>por</b> ou <b>de</b> (Ex: A carta foi escrita <i>por João</i>)."
            },
            {
                category: "Complemento Nominal",
                front: "Qual classe de palavras pode receber um <b>complemento nominal</b> e qual é a função dessa estrutura?",
                back: "O complemento nominal integra o sentido de <b>nomes</b> (substantivos abstratos, adjetivos ou advérbios) que possuem sentido transitivo, sendo sempre introduzido por preposição."
            },
            {
                category: "Predicativo do Objeto",
                front: "Qual é a função do <b>predicativo do objeto</b> em uma oração?",
                back: "Atribuir uma característica ou estado ao objeto (direto ou indireto) por intermédio de um verbo transitivo (Ex: Considero o filme <i>excelente</i>)."
            },
            {
                category: "Aposto",
                front: "Qual é a função morfossintática do <b>aposto</b>?",
                back: "Explicar, enumerar, resumir ou especificar um termo substantivo anterior, funcionando sintaticamente como um termo acessório da oração."
            },
            {
                category: "Vocativo",
                front: "Qual é a função sintática do <b>vocativo</b> e a qual classe ele costuma se ligar?",
                back: "Sintaticamente, o vocativo <b>não pertence à estrutura oracional</b> (não faz parte nem do sujeito nem do predicado); serve para chamar, invocar ou interpelar alguém, ligando-se a substantivos ou nomes próprios."
            },
            {
                category: "Partícula Apassivadora",
                front: "Qual é a função da partícula <b>'se'</b> quando atua como partícula apassivadora (ou apassibidora)?",
                back: "Ela se une a um verbo transitivo direto (VTD), indicando que o sujeito sofre a ação (voz passiva sintética), fazendo com que o termo seguinte atue como <b>sujeito paciente</b> (Ex: Vendem-se <i>casas</i>)."
            },
            {
                category: "Índice de Indeterminação do Sujeito",
                front: "Qual é a função do <b>'se'</b> como índice de indeterminação do sujeito?",
                back: "Aparece com verbos intransitivos, transitivos indiretos ou de ligação, indicando que o sujeito da oração não pode ou não se quer determinar (Ex: Precisa-se <i>de funcionários</i>)."
            },
            {
                category: "Derivação Imprópria (Morfossintaxe)",
                front: "O que ocorre morfossintaticamente na <b>derivação imprópria</b> quando um adjetivo vira substantivo?",
                back: "Uma palavra de uma classe gramatical passa a exercer a função típica de outra classe devido ao contexto sintático (Ex: O <b>azul</b> do céu -> adjetivo transformado em substantivo pelo artigo)."
            },
            {
                category: "Adjunto Adnominal vs Complemento Nominal",
                front: "Como diferenciar funcionalmente o <b>adjunto adnominal</b> do <b>complemento nominal</b> ligados a substantivos abstratos?",
                back: "• Adjunto adnominal tem valor <b>ativo</b> (pratica a ação, ex: o amor de mãe = a mãe ama).<br>• Complemento nominal tem valor <b>passivo</b> (recebe a ação, ex: o amor a Deus = alguém ama a Deus)."
            },
            {
                category: "Palavra 'Que'",
                front: "Por que a palavra <b>'que'</b> é considerada uma das classes de palavras mais versáteis da língua?",
                back: "Porque pode atuar como pronome relativo, pronome interrogativo, pronome adjetivo, conjunção integrante, conjunção coordenativa explicativa, advérbio de intensidade ou interjeição, dependendo estritamente do contexto sintático."
            },
            {
                category: "Palavra 'Se'",
                front: "Quais são as principais funções morfossintáticas que a palavra <b>'se'</b> pode assumir?",
                back: "Pode ser: pronome apassivador, índice de indeterminação do sujeito, pronome reflexivo (objeto direto/indireto), parte integrante do verbo, conjunção condicional ou conjunção integrante."
            },
            {
                category: "Resumo: Morfologia vs Sintaxe",
                front: "Qual é a diferença fundamental entre a análise <b>morfológica</b> e a análise <b>sintática</b> de uma palavra?",
                back: "A <b>Morfologia</b> classifica a palavra isoladamente de acordo com sua classe (substantivo, verbo, etc.). A <b>Sintaxe</b> estuda o papel e a função que essa mesma palavra exerce dentro da estrutura da oração."
            }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('flashcard');
        const categoryElement = document.getElementById('card-category');
        const frontElement = document.getElementById('card-front');
        const backElement = document.getElementById('card-back');
        const trackerElement = document.getElementById('card-tracker');

        function updateCard() {
            cardElement.classList.remove('is-flipped');
            setTimeout(() => {
                const currentData = cardsData[currentIndex];
                categoryElement.innerText = currentData.category;
                frontElement.innerHTML = currentData.front;
                backElement.innerHTML = currentData.back;
                trackerElement.innerText = `Card ${currentIndex + 1} de ${cardsData.length}`;
            }, 150);
        }

        function flipCard() {
            cardElement.classList.toggle('is-flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cardsData.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
            updateCard();
        }

        // Inicializar
        updateCard();

        // Suporte a teclas do teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });
    </script>
</body>
</html>
